<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL Companion Tracker</title>
<style>
  /* ── Reset & Base ─────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e1117;
    --surface:   #161b22;
    --surface2:  #1c2230;
    --border:    #30363d;
    --text:      #e6edf3;
    --text-dim:  #8b949e;
    --accent:    #58a6ff;
    --green:     #3fb950;
    --yellow:    #d29922;
    --orange:    #db6d28;
    --red:       #f85149;
    --purple:    #bc8cff;
    --pink:      #f778ba;
    --radius:    12px;
    --radius-sm: 8px;
    --font:      'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono:      'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  html { font-size: 16px; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: 0;
    overflow: hidden;
  }

  /* ── Desktop Panel ───────────────────────────────── */
  .phone-frame {
    width: 720px;
    height: 100vh;
    background: var(--surface);
    border-radius: 0;
    border: none;
    border-right: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 4px 0 24px rgba(0,0,0,.3);
    position: relative;
  }

  /* ── Status Bar ──────────────────────────────────── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px 6px;
    font-size: .75rem;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--surface);
    flex-shrink: 0;
  }
  .status-bar .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 4px; vertical-align: middle; }

  /* ── Header ──────────────────────────────────────── */
  .header {
    padding: 12px 20px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header h1 .logo {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: .8rem;
  }
  .header-subtitle { font-size: .78rem; color: var(--text-dim); margin-top: 2px; }

  /* ── Scrollable Content ──────────────────────────── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .content::-webkit-scrollbar { width: 5px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── Page (hidden by default) ────────────────────── */
  .page { display: none; }
  .page.active { display: block; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ── Cards ───────────────────────────────────────── */
  .card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .card-title { font-size: .85rem; font-weight: 600; color: var(--text); text-transform: uppercase; letter-spacing: .5px; }

  /* ── Stat Grid ───────────────────────────────────── */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 18px;
  }
  .stat-label { font-size: .78rem; color: var(--text-dim); font-weight: 500; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
  .stat-number { font-size: 1.5rem; font-weight: 700; }
  .stat-sub { font-size: .75rem; color: var(--text-dim); margin-top: 4px; }

  /* ── Risk Donut (CSS only) ───────────────────────── */
  .donut-container { display: flex; align-items: center; gap: 24px; }
  .donut {
    width: 110px; height: 110px;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
  }
  .donut::after {
    content: '';
    position: absolute;
    inset: 18px;
    background: var(--surface2);
    border-radius: 50%;
  }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: .88rem; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── Alert Badges ────────────────────────────────── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 11px;
    border-radius: 20px;
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .badge-info    { background: rgba(88,166,255,.12); color: var(--accent); }
  .badge-watch   { background: rgba(63,185,80,.12);  color: var(--green); }
  .badge-warn    { background: rgba(210,153,34,.15); color: var(--yellow); }
  .badge-danger  { background: rgba(248,81,73,.12);  color: var(--red); }

  /* ── Timeline ────────────────────────────────────── */
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--border);
    border-radius: 2px;
  }
  .tl-item {
    position: relative;
    padding: 14px 16px;
    margin-bottom: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .tl-item:hover { border-color: var(--accent); background: rgba(88,166,255,.04); }
  .tl-item::before {
    content: '';
    position: absolute;
    left: -20px;
    top: 16px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
  }
  .tl-item.risk-info::before    { border-color: var(--accent); background: var(--accent); }
  .tl-item.risk-watch::before   { border-color: var(--green);  background: var(--green); }
  .tl-item.risk-warn::before    { border-color: var(--yellow); background: var(--yellow); }
  .tl-item.risk-danger::before  { border-color: var(--red);    background: var(--red); }
  .tl-time { font-size: .74rem; color: var(--text-dim); font-family: var(--mono); }
  .tl-summary { font-size: .9rem; margin-top: 5px; line-height: 1.4; }
  .tl-summary .icon { margin-right: 5px; }
  .tl-meta { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .tl-file { font-size: .76rem; color: var(--purple); font-family: var(--mono); background: rgba(188,140,255,.08); padding: 3px 9px; border-radius: 4px; }
  .source-badge { font-size: .7rem; padding: 2px 7px; border-radius: 4px; background: rgba(255,255,255,.06); font-weight: 500; white-space: nowrap; }
  .tl-detail {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: .8rem;
    color: var(--text-dim);
    font-family: var(--mono);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.7;
  }
  .tl-item.expanded .tl-detail { display: block; }

  /* ── Sub-agent nesting ───────────────────────────── */
  .tl-item.subagent {
    margin-left: 28px;
    border-left: 3px solid var(--purple);
    background: rgba(188,140,255,.03);
  }
  .tl-item.subagent::before { border-color: var(--purple); background: var(--purple); }
  .tl-item.subagent:hover { border-color: var(--purple); background: rgba(188,140,255,.06); }
  .agent-badge {
    font-size: .72rem;
    padding: 3px 8px;
    border-radius: 5px;
    background: rgba(188,140,255,.12);
    color: var(--purple);
    font-weight: 500;
    white-space: nowrap;
  }
  .agent-scope-header {
    margin-left: 28px;
    padding: 8px 14px;
    margin-bottom: 4px;
    font-size: .76rem;
    font-weight: 600;
    color: var(--purple);
    background: rgba(188,140,255,.06);
    border: 1px solid rgba(188,140,255,.15);
    border-left: 3px solid var(--purple);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .agent-scope-header .agent-event-count {
    font-weight: 400;
    color: var(--text-dim);
    font-size: .72rem;
  }
  .agent-stats-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 0;
  }
  .agent-stat-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: rgba(188,140,255,.08);
    border: 1px solid rgba(188,140,255,.12);
    border-radius: 6px;
    font-size: .76rem;
    color: var(--purple);
  }
  .agent-stat-chip .agent-chip-count {
    font-weight: 600;
    color: var(--text);
  }

  /* ── Session List ────────────────────────────────── */
  .session-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .session-item:hover { border-color: var(--accent); }
  .session-heat {
    width: 6px;
    height: 40px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .heat-green  { background: var(--green); }
  .heat-yellow { background: var(--yellow); }
  .heat-orange { background: var(--orange); }
  .heat-red    { background: var(--red); }
  .session-info { flex: 1; min-width: 0; }
  .session-name { font-size: .95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-meta { font-size: .78rem; color: var(--text-dim); margin-top: 3px; }
  .session-stats { display: flex; gap: 16px; flex-shrink: 0; }
  .session-stat { text-align: center; }
  .session-stat-num { font-size: .95rem; font-weight: 700; }
  .session-stat-label { font-size: .68rem; color: var(--text-dim); text-transform: uppercase; }

  /* ── Alert Items ─────────────────────────────────── */
  .alert-item {
    padding: 14px 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    border-left: 4px solid var(--border);
  }
  .alert-item.sev-danger { border-left-color: var(--red); }
  .alert-item.sev-warn   { border-left-color: var(--yellow); }
  .alert-item.sev-watch  { border-left-color: var(--green); }
  .alert-time { font-size: .76rem; color: var(--text-dim); font-family: var(--mono); }
  .alert-msg  { font-size: .92rem; margin-top: 5px; line-height: 1.45; }
  .alert-context { font-size: .78rem; color: var(--text-dim); margin-top: 6px; font-family: var(--mono); line-height: 1.5; }
  .alert-ack {
    margin-top: 8px;
    padding: 5px 12px;
    background: rgba(88,166,255,.1);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-size: .75rem;
    cursor: pointer;
    font-family: var(--font);
  }
  .alert-ack:hover { background: rgba(88,166,255,.2); }
  .alert-ack.done { background: rgba(63,185,80,.1); border-color: var(--green); color: var(--green); pointer-events: none; }

  /* ── Memory Items ────────────────────────────────── */
  .mem-item {
    padding: 16px 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
  }
  .mem-header { display: flex; justify-content: space-between; align-items: center; }
  .mem-scope {
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 5px;
  }
  .scope-user    { background: rgba(188,140,255,.12); color: var(--purple); }
  .scope-session { background: rgba(88,166,255,.12);  color: var(--accent); }
  .scope-repo    { background: rgba(63,185,80,.12);   color: var(--green); }
  .scope-unknown { background: rgba(139,148,158,.12); color: var(--text-dim); }
  .mem-path { font-size: .8rem; font-family: var(--mono); color: var(--text-dim); margin-top: 6px; }
  .mem-content {
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 8px;
    font-size: .82rem;
    font-family: var(--mono);
    color: var(--text);
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .mem-flag {
    margin-top: 10px;
    padding: 10px 14px;
    background: rgba(248,81,73,.08);
    border: 1px solid rgba(248,81,73,.2);
    border-radius: 8px;
    font-size: .82rem;
    color: var(--red);
    line-height: 1.5;
  }

  /* ── Bar Chart (CSS) ─────────────────────────────── */
  .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding: 0 4px; margin: 12px 0 8px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar {
    width: 100%;
    border-radius: 4px 4px 0 0;
    min-height: 2px;
    transition: height .3s;
  }
  .bar-label { font-size: .72rem; color: var(--text-dim); }

  /* ── Filter Bar ──────────────────────────────────── */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    padding: 8px 0;
  }
  .filter-input {
    flex: 1;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: .8rem;
    font-family: var(--font);
    outline: none;
    transition: border-color .15s;
  }
  .filter-input:focus { border-color: var(--accent); }
  .filter-input::placeholder { color: var(--text-dim); }
  .filter-btn {
    padding: 8px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-size: .75rem;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: rgba(88,166,255,.1); border-color: var(--accent); color: var(--accent); }

  /* ── Section Headings ────────────────────────────── */
  .section-title {
    font-size: .82rem;
    font-weight: 600;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-bottom: 14px;
    margin-top: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Pulse animation ─────────────────────────────── */
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .live-pulse { animation: pulse 2s ease-in-out infinite; }

  /* ── Project cards ───────────────────────────────── */
  .project-card {
    padding: 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
  }
  .project-name { font-size: 1rem; font-weight: 600; }
  .project-meta { font-size: .82rem; color: var(--text-dim); margin-top: 4px; }
  .project-bar-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .project-bar-track {
    flex: 1;
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
  }
  .project-bar-seg { height: 100%; }

  /* ── Bottom Nav ──────────────────────────────────── */
  .bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .bottom-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 4px 14px;
    font-size: .7rem;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    transition: color .15s;
    border: none;
    background: none;
    position: relative;
  }
  .bottom-nav-item:hover { color: var(--text); }
  .bottom-nav-item.active { color: var(--accent); }
  .bottom-nav-item.active::before {
    content: '';
    position: absolute;
    top: 0;
    left: 25%;
    right: 25%;
    height: 2px;
    background: var(--accent);
    border-radius: 0 0 2px 2px;
  }
  .bottom-nav-icon { font-size: 1.15rem; line-height: 1; }
  .nav-badge {
    position: absolute;
    top: 5px;
    right: calc(50% - 16px);
    background: var(--red);
    color: #fff;
    font-size: .55rem;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 10px;
    line-height: 1.3;
  }

  /* ── Utility ─────────────────────────────────────── */
  .text-green  { color: var(--green); }
  .text-yellow { color: var(--yellow); }
  .text-orange { color: var(--orange); }
  .text-red    { color: var(--red); }
  .text-accent { color: var(--accent); }
  .text-purple { color: var(--purple); }
  .text-dim    { color: var(--text-dim); }
  .text-pink   { color: var(--pink); }
  .mt-8  { margin-top: 8px; }
  .mt-12 { margin-top: 12px; }
  .mb-8  { margin-bottom: 8px; }
  .mb-12 { margin-bottom: 12px; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }

  /* ── Empty state ─────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-dim);
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: 12px; }
  .empty-state .msg { font-size: .92rem; line-height: 1.6; }

  /* ── Loading shimmer ─────────────────────────────── */
  @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
    background-size: 400px 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    border-radius: var(--radius-sm);
    height: 60px;
    margin-bottom: 10px;
  }

  /* ── Context / Breadcrumb bar ──────────────────── */
  .context-bar {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: .76rem;
    color: var(--text-dim);
    flex-shrink: 0;
    overflow: hidden;
  }
  .context-bar.visible { display: flex; }
  .ctx-back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    font-size: .85rem;
    transition: all .15s;
  }
  .ctx-back:hover { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,.06); }
  .ctx-crumbs {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    overflow: hidden;
  }
  .ctx-crumb {
    white-space: nowrap;
    cursor: pointer;
    color: var(--accent);
    transition: color .15s;
  }
  .ctx-crumb:hover { color: #fff; }
  .ctx-crumb.current { color: var(--text); cursor: default; }
  .ctx-sep { color: var(--text-dim); opacity: .4; flex-shrink: 0; }

  /* ── Filter chip bar ─────────────────────────────── */
  .chip-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 4px 0 8px;
  }
  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    font-size: .72rem;
    font-family: var(--font);
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--text); }
  .filter-chip.active { background: rgba(88,166,255,.1); border-color: var(--accent); color: var(--accent); }
  .filter-chip .chip-x {
    font-size: .65rem;
    margin-left: 2px;
    opacity: 0;
    transition: opacity .15s;
  }
  .filter-chip.active .chip-x { opacity: 1; }

  /* ── Clickable cards ─────────────────────────────── */
  .project-card.clickable { cursor: pointer; transition: border-color .15s; }
  .project-card.clickable:hover { border-color: var(--accent); }

<script>
// ── State ──
let state = {
  currentPage: 'home',
  selectedSessionId: null,
  riskFilterActive: false,
  stats: null,
  sessions: [],
  alerts: [],
  memory: [],
  projects: [],
  timelineEvents: [],
  liveLastTimestamp: null,
  viewingFile: null,
  navStack: [],
  navContext: null,
  timelineFilter: {},
  homeRange: 'today',         // today | week | month
  securityFilter: 'all',      // all | danger | warn
  sseNewEvents: 0,            // count of new events since last timeline view
};

// ── API Helpers ──
async function api(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error(res.statusText);
    return await res.json();
  } catch (e) {
    console.error('[api]', path, e);
    return null;
  }
}

// ── File Deep-Link Helpers ──
async function viewFile(filePath) {
  state.viewingFile = filePath;
  const overlay = document.getElementById('fileViewerOverlay');
  overlay.classList.add('open');
  document.getElementById('fvPath').textContent = filePath;
  document.getElementById('fvSize').textContent = '';
  document.getElementById('fvContent').innerHTML = '<div class="fv-loading">Loading file...</div>';
  document.getElementById('fvInfoBar').textContent = '';

  const data = await api(`/api/file/read?path=${encodeURIComponent(filePath)}`);
  if (!data || data.error) {
    document.getElementById('fvContent').innerHTML = `<div class="fv-error">⚠️ ${esc(data?.error || 'Could not read file')}</div>`;
    return;
  }

  const ext = filePath.split('.').pop()?.toLowerCase() || '';
  const lines = data.content.split('\n');
  document.getElementById('fvSize').textContent = formatFileSize(data.size);
  document.getElementById('fvContent').innerHTML = `<pre class="fv-code">${lines.map(l => `<span class="fv-line">${escHtml(l) || ' '}</span>`).join('\n')}</pre>`;
  document.getElementById('fvInfoBar').textContent = `${lines.length} lines · ${ext.toUpperCase() || 'TXT'}${data.truncated ? ' · Truncated (file too large)' : ''}`;
}

async function viewMemoryFile(filePath) {
  state.viewingFile = filePath;
  const overlay = document.getElementById('fileViewerOverlay');
  overlay.classList.add('open');
  document.getElementById('fvPath').textContent = filePath;
  document.getElementById('fvSize').textContent = '';
  document.getElementById('fvContent').innerHTML = '<div class="fv-loading">Loading memory file...</div>';
  document.getElementById('fvInfoBar').textContent = '';

  const data = await api(`/api/file/read?path=${encodeURIComponent(filePath)}`);
  if (!data || data.error) {
    document.getElementById('fvContent').innerHTML = `<div class="fv-error">⚠️ ${esc(data?.error || 'Could not read file')}</div>`;
    return;
  }

  // Find memory ops that wrote to this path
  const memOps = await api(`/api/memory?limit=200`);
  const writes = (memOps || []).filter(o => o.memory_path === filePath && (o.operation === 'write'));
  const writeTimestamps = writes.map(w => w.timestamp);

  const ext = filePath.split('.').pop()?.toLowerCase() || '';
  const lines = data.content.split('\n');
  document.getElementById('fvSize').textContent = formatFileSize(data.size);

  // Highlight recently-written lines by checking memory write summaries
  const recentSummaries = writes.slice(-3).map(w => w.content_summary || '').join('\n');
  const recentWords = new Set(recentSummaries.split(/\s+/).filter(w => w.length > 4).slice(0, 30));

  document.getElementById('fvContent').innerHTML = `<pre class="fv-code">${lines.map((l, i) => {
    // Heuristic: highlight lines that contain words from recent memory writes
    const isHighlighted = recentWords.size > 0 && [...recentWords].some(w => l.includes(w));
    return `<span class="fv-line${isHighlighted ? ' highlighted' : ''}">${escHtml(l) || ' '}</span>`;
  }).join('\n')}</pre>`;

  const writeInfo = writes.length > 0
    ? ` · ${writes.length} write${writes.length > 1 ? 's' : ''} tracked (last: ${fmtTime(writes[writes.length-1].timestamp)})`
    : '';
  document.getElementById('fvInfoBar').textContent = `${lines.length} lines · ${ext.toUpperCase() || 'TXT'}${writeInfo}${data.truncated ? ' · Truncated' : ''}`;
}

function closeFileViewer() {
  document.getElementById('fileViewerOverlay').classList.remove('open');
  state.viewingFile = null;
}

async function openInEditor(filePath) {
  if (!filePath) return;
  await fetch('/api/file/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: filePath }) });
}

async function revealInExplorer(filePath) {
  if (!filePath) return;
  await fetch('/api/file/reveal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: filePath }) });
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fileActionButtons(filePath) {
  const ep = escAttr(filePath);
  return `<span class="file-actions" onclick="event.stopPropagation()">` +
    `<button class="file-action-btn" onclick="viewFile('${ep}')" title="View">👁</button>` +
    `<button class="file-action-btn" onclick="openInEditor('${ep}')" title="Open in Editor">✏️</button>` +
    `<button class="file-action-btn" onclick="revealInExplorer('${ep}')" title="Open in Explorer">📂</button>` +
    `</span>`;
}

// Escape a string for safe use in inline onclick='...' attributes
function escAttr(s) {
  if (!s) return '';
  return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── SSE Real-time Connection ──
let sseRetryTimer = null;
function connectSSE() {
  const es = new EventSource('/api/events/stream');
  es.addEventListener('event', (e) => {
    const data = JSON.parse(e.data);
    // Auto-refresh current page
    if (state.currentPage === 'home') loadHome();
    if (state.currentPage === 'timeline' && state.selectedSessionId === data.session_id) {
      loadTimeline(state.selectedSessionId);
    }
    // Update new-event badge
    if (state.currentPage !== 'timeline') {
      state.sseNewEvents++;
      updateNavBadges();
    }
  });
  es.addEventListener('alert', (e) => {
    const data = JSON.parse(e.data);
    showToast(data.severity, data.message);
    if (state.currentPage === 'security') loadSecurity();
    if (state.currentPage === 'home') loadHome();
    updateNavBadges();
  });
  es.addEventListener('session-ended', (e) => {
    if (state.currentPage === 'sessions') loadSessions();
  });
  es.onerror = () => {
    es.close();
    if (sseRetryTimer) clearTimeout(sseRetryTimer);
    sseRetryTimer = setTimeout(connectSSE, 5000);
  };
}
connectSSE();

// ── Toast Notifications ──
function showToast(severity, message) {
  const container = document.getElementById('toastContainer');
  const icon = severity === 'danger' ? '🚨' : severity === 'warn' ? '⚠️' : 'ℹ️';
  const toast = document.createElement('div');
  toast.className = `toast ${severity}`;
  toast.innerHTML = `<span class="toast-icon">${icon}</span><span class="toast-msg">${esc(message)}</span><span class="toast-close" onclick="this.parentElement.remove()">✕</span>`;
  toast.onclick = (e) => {
    if (e.target.classList.contains('toast-close')) return;
    showPage('security');
    toast.remove();
  };
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentElement) toast.remove(); }, 8000);
}

// ── Nav Badge Updates ──
function updateNavBadges() {
  // Timeline badge for new events
  const tlBtn = document.querySelector('[data-page="timeline"]');
  let tlBadge = tlBtn?.querySelector('.nav-badge-events');

// ── Global Search ──
let searchDebounce = null;
function openSearch() {
  document.getElementById('searchOverlay').classList.add('open');
  const input = document.getElementById('globalSearchInput');
  input.value = '';
  input.focus();

}
document.getElementById('globalSearchInput')?.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();

    document.getElementById('searchResults').innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:.85rem;">Type at least 2 characters...</div>';

  }
  searchDebounce = setTimeout(async () => {
    const results = await api(`/api/search?q=${encodeURIComponent(q)}&limit=20`);

      el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:.85rem;">No results found</div>';

});
document.addEventListener('keydown', (e) => {

  }
  if (e.key === 'Escape' && document.getElementById('searchOverlay').classList.contains('open')) {

  }

// ── Navigation History & Breadcrumbs ──
function navTo(page, context, sessionId) {
  // Push current state onto stack before navigating
  if (state.currentPage !== page || state.selectedSessionId !== sessionId) {
    state.navStack.push({
      page: state.currentPage,
      sessionId: state.selectedSessionId,
      context: state.navContext,
      filter: { ...state.timelineFilter },
    });
    if (state.navStack.length > 20) state.navStack.shift();
  }
  state.navContext = context || null;
  updateContextBar();
  showPage(page, sessionId);
}

function navBack() {
  if (!state.navStack.length) return;
  const prev = state.navStack.pop();
  state.navContext = prev.context;
  state.timelineFilter = prev.filter || {};
  updateContextBar();
  showPage(prev.page, prev.sessionId);
}

function updateContextBar() {
  const bar = document.getElementById('contextBar');
  const crumbs = document.getElementById('ctxCrumbs');
  if (!state.navContext || !state.navContext.crumbs?.length) {
    bar.classList.remove('visible');
    return;
  }
  bar.classList.toggle('visible', state.navStack.length > 0 || state.navContext.crumbs.length > 1);
  crumbs.innerHTML = state.navContext.crumbs.map((c, i, arr) => {
    const isLast = i === arr.length - 1;
    const sep = i < arr.length - 1 ? '<span class="ctx-sep">›</span>' : '';
    if (isLast) return `<span class="ctx-crumb current">${esc(c.label)}</span>${sep}`;
    return `<span class="ctx-crumb" onclick="${c.action}">${esc(c.label)}</span>${sep}`;
  }).join('');
}

async function drillAlertToEvent(eventId, sessionId) {

async function drillProjectSessions(projectName) {

// ── Format Helpers ──
const ICONS = {
  file_read: '📂', file_write: '✏️', file_create: '📄', file_delete: '🗑️',
  terminal_command: '🖥️', terminal_output: '🖥️', terminal_send: '🖥️', terminal_kill: '🖥️',
  git_commit: '📦', git_push: '🚀', git_reset: '⏪', git_checkout: '🔀', git_operation: '🔧',
  memory_read: '🧠', memory_write: '🧠', memory_delete: '🧠',
  web_fetch: '🌐', search: '🔍', subagent_spawn: '🤖',
  session_start: '▶️', session_end: '⏹️',
  user_message: '👤', assistant_message: '💬',
  tool_call: '🔧',
};

function icon(type) { return ICONS[type] || '⚡'; }

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diffMs = now - d;
  const diffDays = Math.floor(diffMs / 86400000);
  if (diffDays === 0) return 'Today';
  if (diffDays === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function heatClass(danger, warn) {
  if (danger > 0) return 'heat-red';
  if (warn > 2) return 'heat-orange';
  if (warn > 0) return 'heat-yellow';
  return 'heat-green';
}

function riskColor(risk) {
  return { info: 'var(--accent)', watch: 'var(--green)', warn: 'var(--yellow)', danger: 'var(--red)' }[risk] || 'var(--text-dim)';
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

const SOURCE_TOOLS = {
  'vscode-copilot': { icon: '🟦', label: 'VS Code', color: '#58a6ff' },
  'claude-code':    { icon: '🟠', label: 'Claude',  color: '#db6d28' },
  'gemini-cli':     { icon: '🔵', label: 'Gemini',  color: '#58a6ff' },
};
function sourceBadge(src) {
  const t = SOURCE_TOOLS[src] || { icon: '📄', label: src || '?', color: 'var(--text-dim)' };
  return `<span class="source-badge" style="color:${t.color}">${t.icon} ${esc(t.label)}</span>`;
}
function buildSourcesSummary(sessions) {
  if (!sessions || !sessions.length) return '';
  const counts = {};
  sessions.forEach(s => { const src = s.source_tool || 'vscode-copilot'; counts[src] = (counts[src] || 0) + 1; });
  const keys = Object.keys(counts);
  if (keys.length <= 1 && keys[0] === 'vscode-copilot') return '';
  const items = keys.map(k => {
    const t = SOURCE_TOOLS[k] || { icon: '📄', label: k, color: 'var(--text-dim)' };
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;"><span style="font-size:1.2rem">${t.icon}</span><span style="flex:1;color:${t.color};font-weight:500;">${esc(t.label)}</span><span style="color:var(--text-dim)">${counts[k]} session${counts[k]>1?'s':''}</span></div>`;
  }).join('');
  return `<div class="card"><div class="card-title mb-8">Active Sources</div>${items}</div>`;
}

// ── HOME Page ──
async function loadHome() {
  const [stats, sessions] = await Promise.all([api(`/api/stats?range=${state.homeRange}`), api('/api/sessions')]);
  state.sessions = sessions || [];
  if (!stats) {
    document.getElementById('homeContent').innerHTML = '<div class="empty-state"><div class="icon">📊</div><div class="msg">No data yet.<br>Start an AI coding session and events will appear here.</div></div>';
    return;
  }
  state.stats = stats;
  const t = stats.today;
  const rd = stats.riskDistribution || [];
  const riskMap = {};
  rd.forEach(r => riskMap[r.risk_level] = r.count);
  const total = rd.reduce((s, r) => s + r.count, 0) || 1;
  const infoPct = ((riskMap.info || 0) / total * 100).toFixed(0);
  const watchPct = ((riskMap.watch || 0) / total * 100).toFixed(0);
  const warnPct = ((riskMap.warn || 0) / total * 100).toFixed(0);
  const dangerPct = ((riskMap.danger || 0) / total * 100).toFixed(0);

  // Daily chart
  const dc = stats.dailyCounts || [];
  const maxCount = Math.max(...dc.map(d => d.count), 1);
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const barHtml = dc.map((d, i) => {
    const h = Math.round((d.count / maxCount) * 100);
    const day = days[new Date(d.date).getDay()];
    const isToday = i === dc.length - 1;
    const bg = isToday ? 'linear-gradient(var(--accent),var(--purple))' : 'var(--accent)';
    return `<div class="bar-col"><div class="bar" style="height:${h}px;background:${bg};${isToday ? '' : 'opacity:.7;'}"></div><div class="bar-label">${isToday ? 'Today' : day}</div></div>`;
  }).join('');

  // Recent alerts
  const alerts = await api('/api/alerts?limit=3');
  const alertsHtml = (alerts || []).map(a => `
    <div class="alert-item clickable sev-${a.severity}" onclick="drillAlertToEvent(${a.event_id || 0}, '${esc(a.session_id || '')}')">
      <div class="flex-between">
        <div class="alert-time">${fmtTime(a.timestamp)}</div>
        <span class="badge badge-${a.severity}">${esc(a.severity)}</span>
      </div>
      <div class="alert-msg">${esc(a.message)}</div>
    </div>
  `).join('');

  // Update security badge
  if (t.unreviewedAlerts > 0) {
    const badge = document.getElementById('securityBadge');
    badge.textContent = t.unreviewedAlerts;
    badge.style.display = '';
  }

  document.getElementById('homeContent').innerHTML = `
    <div class="range-selector">
      <button class="range-btn ${state.homeRange === 'today' ? 'active' : ''}" onclick="state.homeRange='today';loadHome()">Today</button>
      <button class="range-btn ${state.homeRange === 'week' ? 'active' : ''}" onclick="state.homeRange='week';loadHome()">Week</button>
      <button class="range-btn ${state.homeRange === 'month' ? 'active' : ''}" onclick="state.homeRange='month';loadHome()">Month</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Events</div>
        <div class="stat-number">${t.totalEvents}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Files Changed</div>
        <div class="stat-number">${t.filesChanged}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Commands Run</div>
        <div class="stat-number">${t.commandsRun}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Alerts</div>
        <div class="stat-number ${t.alertCount > 0 ? 'text-red' : ''}">${t.alertCount}</div>
        ${t.unreviewedAlerts > 0 ? `<div class="stat-sub text-red">${t.unreviewedAlerts} unreviewed</div>` : ''}
      </div>
    </div>

    ${stats.sessionCount !== undefined ? `
    <div class="stat-grid" style="margin-top:0;">
      <div class="stat-card">
        <div class="stat-label">Sessions</div>
        <div class="stat-number">${stats.sessionCount}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Now</div>
        <div class="stat-number text-green">${stats.activeSessions || 0}</div>
      </div>
    </div>` : ''}

    <div class="card">
      <div class="card-title mb-8">Risk Distribution</div>
      <div class="donut-container">
        <div class="donut" style="background:conic-gradient(var(--accent) 0% ${infoPct}%, var(--green) ${infoPct}% ${+infoPct + +watchPct}%, var(--yellow) ${+infoPct + +watchPct}% ${+infoPct + +watchPct + +warnPct}%, var(--red) ${+infoPct + +watchPct + +warnPct}% 100%);"></div>
        <div class="donut-legend">
          <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span> Info — ${riskMap.info || 0}</div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span> Watch — ${riskMap.watch || 0}</div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--yellow)"></span> Warn — ${riskMap.warn || 0}</div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span> Danger — ${riskMap.danger || 0}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title mb-8">Activity (Last ${state.homeRange === 'month' ? '30' : '7'} Days)</div>
      <div class="bar-chart">${barHtml}</div>
    </div>

    ${stats.topFiles && stats.topFiles.length > 0 ? `
    <div class="card">
      <div class="card-title mb-8">Most Active Files</div>
      ${stats.topFiles.slice(0, 5).map(f => {
        const shortName = (f.path || '').split(/[\\/]/).pop() || f.path;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:.82rem;">
          <span class="detail-file-link" onclick="viewFile('${escAttr(f.path)}')" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(shortName)}</span>

      }).join('')}
    </div>` : ''}

    ${alertsHtml.length > 0 ? '<div class="section-title">Recent Alerts</div>' + alertsHtml : ''}

    ${buildSourcesSummary(state.sessions)}
  `;
}

function toggleRiskFilter() {
  riskOnly = !riskOnly;
  document.getElementById('riskFilterBtn').classList.toggle('active', riskOnly);
  renderTimeline();
}

async function loadTimeline(sessionId) {
  if (!sessionId) {
    // Load most recent events across all sessions
    const events = await api('/api/events/recent?limit=200');
    state.timelineEvents = events || [];
    document.getElementById('timelineHeader').style.display = 'none';
    document.getElementById('tlAgentStats').innerHTML = '';
    renderTimeline();
    return;
  }
  state.selectedSessionId = sessionId;
  const [session, events, agents] = await Promise.all([
    api(`/api/sessions/${sessionId}`),
    api(`/api/sessions/${sessionId}/events?limit=500`),
    api(`/api/sessions/${sessionId}/agents`),
  ]);
  state.timelineEvents = events || [];

  const hdr = document.getElementById('timelineHeader');
  if (session) {
    hdr.style.display = '';
    document.getElementById('tlProjectName').textContent = session.project_name || session.id.substring(0,8);
    document.getElementById('tlSessionMeta').textContent = `Session ${session.id.substring(0,8)} · ${(events||[]).length} events`;
    const alCount = session.danger_count + session.warn_count;
    const badge = document.getElementById('tlAlertBadge');
    if (alCount > 0) {
      badge.textContent = `${alCount} alerts`;
      badge.style.display = '';
    } else {
      badge.style.display = 'none';
    }
  }
  // Show agent breakdown if sub-agents exist
  const agentStatsEl = document.getElementById('tlAgentStats');
  if (agents && agents.length > 0) {
    agentStatsEl.innerHTML = `<div class="agent-stats-bar">${agents.map(a =>
      `<div class="agent-stat-chip">🤖 ${esc(a.agent_id.replace(/^sub:/, ''))} <span class="agent-chip-count">${a.event_count}</span></div>`
    ).join('')}</div>`;
  } else {
    agentStatsEl.innerHTML = '';
  }
  renderTimeline();
}

function renderTimeline() {
  let events = state.timelineEvents;
  if (riskOnly) events = events.filter(e => e.risk_level === 'warn' || e.risk_level === 'danger');

  // Apply filter chips
  const tf = state.timelineFilter;
  if (tf.agent) events = events.filter(e => e.agent_id === tf.agent);
  if (tf.source) events = events.filter(e => e.source_tool === tf.source);
  if (tf.type) events = events.filter(e => e.event_type === tf.type);

  const searchQ = document.getElementById('timelineSearch')?.value?.toLowerCase() || '';
  if (searchQ) events = events.filter(e =>
    (e.summary || '').toLowerCase().includes(searchQ) ||
    (e.tool_name || '').toLowerCase().includes(searchQ) ||
    (e.agent_id || '').toLowerCase().includes(searchQ) ||
    (e.file_paths || []).some(f => f.toLowerCase().includes(searchQ))
  );

  // Render active filter chips
  renderFilterChips();

  if (!events.length) {
    document.getElementById('timelineContent').innerHTML = '<div class="empty-state"><div class="icon">⏱️</div><div class="msg">No events to show.<br>Events will appear as the AI agent works.</div></div>';
    return;
  }

  const isRecentView = !state.selectedSessionId;

  // Build agent scope headers: track which agent scopes are active
  const html = [];
  let currentAgent = null;
  let agentEventCount = 0;

  for (let i = 0; i < events.length; i++) {
    const e = events[i];
    const isSubagent = e.agent_id && e.agent_id.startsWith('sub:');
    const agentName = isSubagent ? e.agent_id.replace(/^sub:/, '') : null;

    // Detect scope transitions
    if (isSubagent && currentAgent !== e.agent_id) {
      if (currentAgent) { /* previous scope ended */ }
      agentEventCount = 0;
      for (let j = i; j < events.length; j++) {
        if (events[j].agent_id === e.agent_id) agentEventCount++;
        else if (!events[j].agent_id?.startsWith('sub:') || events[j].agent_id !== e.agent_id) break;
      }
      currentAgent = e.agent_id;
      html.push(`<div class="agent-scope-header" onclick="setFilter('agent','${escAttr(e.agent_id)}')" style="cursor:pointer" title="Filter to this agent">🤖 ${esc(agentName)} <span class="agent-event-count">${agentEventCount} event${agentEventCount !== 1 ? 's' : ''}</span></div>`);
    } else if (!isSubagent && currentAgent) {
      currentAgent = null;
    }

    const files = (e.file_paths || []).filter(f => f);
    const fileHtml = files.map(f => `<span class="tl-file" onclick="event.stopPropagation();viewFile('${escAttr(f)}')" title="${esc(f)}">${esc(f.split(/[\\/]/).pop())}</span>${fileActionButtons(f)}`).join('');
    const detail = buildDetail(e);
    const agentBadge = isSubagent ? `<span class="agent-badge" onclick="event.stopPropagation();setFilter('agent','${escAttr(e.agent_id)}')" title="Filter by agent" style="cursor:pointer">🤖 ${esc(e.agent_id)}</span>` : '';
    const subagentDetail = e.event_type === 'subagent_spawn' && e.parameters ? buildSubagentDetail(e.parameters) : '';
    const sessionLink = isRecentView && e.session_id ? `<span class="tl-session-link" onclick="event.stopPropagation();drillToSession('${esc(e.session_id)}','')">📋 ${esc(e.session_id.substring(0,8))}</span>` : '';
    const sourceBadgeHtml = e.source_tool && e.source_tool !== 'vscode-copilot' ? `<span onclick="event.stopPropagation();setFilter('source','${escAttr(e.source_tool)}')" style="cursor:pointer">${sourceBadge(e.source_tool)}</span>` : '';
    html.push(`
      <div class="tl-item${isSubagent ? ' subagent' : ''} risk-${e.risk_level}" data-event-id="${e.id || ''}" onclick="this.classList.toggle('expanded')">
        <div class="tl-time">${fmtTime(e.timestamp)}${sessionLink}</div>
        <div class="tl-summary"><span class="icon">${icon(e.event_type)}</span> ${esc(e.summary)}</div>
        <div class="tl-meta">
          <span class="badge badge-${e.risk_level}" onclick="event.stopPropagation();setFilter('type','${escAttr(e.event_type)}')" style="cursor:pointer" title="Filter by type">${e.risk_level}</span>
          ${sourceBadgeHtml}
          ${agentBadge}
          ${fileHtml}
        </div>
        ${detail || subagentDetail ? `<div class="tl-detail">${buildDetailHtml(e)}${subagentDetail}</div>` : ''}
      </div>
    `);
  }

  document.getElementById('timelineContent').innerHTML = html.join('');
}

// ── Timeline filter chip management ──
function setFilter(key, value) {
  if (state.timelineFilter[key] === value) {
    delete state.timelineFilter[key];
  } else {
    state.timelineFilter[key] = value;
  }
  renderTimeline();
}

function clearFilters() {
  state.timelineFilter = {};
  riskOnly = false;
  document.getElementById('riskFilterBtn').classList.remove('active');
  renderTimeline();
}

function renderFilterChips() {
  let chipEl = document.getElementById('tlFilterChips');
  if (!chipEl) {
    const bar = document.getElementById('timelineSearch')?.parentElement;
    if (!bar) return;
    chipEl = document.createElement('div');
    chipEl.id = 'tlFilterChips';
    chipEl.className = 'chip-bar';
    bar.after(chipEl);
  }
  const tf = state.timelineFilter;
  const chips = [];
  if (tf.agent) chips.push(`<span class="filter-chip active" onclick="setFilter('agent','${escAttr(tf.agent)}')">🤖 ${esc(tf.agent)} <span class="chip-x">✕</span></span>`);
  if (tf.source) chips.push(`<span class="filter-chip active" onclick="setFilter('source','${escAttr(tf.source)}')">${esc(tf.source)} <span class="chip-x">✕</span></span>`);
  if (tf.type) chips.push(`<span class="filter-chip active" onclick="setFilter('type','${escAttr(tf.type)}')">${esc(tf.type)} <span class="chip-x">✕</span></span>`);
  if (chips.length > 0) chips.push(`<span class="filter-chip" onclick="clearFilters()">Clear all</span>`);
  chipEl.innerHTML = chips.join('');
}

function buildDetail(e) {
  let parts = [`type: ${e.event_type}`];
  if (e.tool_name) parts.push(`tool: ${e.tool_name}`);
  if (e.agent_id && e.agent_id !== 'main') parts.push(`agent: ${e.agent_id}`);
  if (e.parent_agent_id) parts.push(`parent: ${e.parent_agent_id}`);
  if (e.command) parts.push(`command: ${e.command}`);
  if (e.file_paths?.length) parts.push(`files: ${e.file_paths.join(', ')}`);
  if (e.duration_ms) parts.push(`duration: ${e.duration_ms}ms`);
  return parts.join('\n');
}

function buildDetailHtml(e) {
  let parts = [`type: ${esc(e.event_type)}`];
  if (e.tool_name) parts.push(`tool: ${esc(e.tool_name)}`);
  if (e.agent_id && e.agent_id !== 'main') parts.push(`agent: ${esc(e.agent_id)}`);
  if (e.parent_agent_id) parts.push(`parent: ${esc(e.parent_agent_id)}`);
  if (e.command) parts.push(`command: ${esc(e.command)}`);
  if (e.file_paths?.length) {
    const links = e.file_paths.map(f =>
      `<span class="detail-file-link" onclick="event.stopPropagation();viewFile('${escAttr(f)}')">${esc(f)}</span>`
      + ` <span class="file-actions" onclick="event.stopPropagation()">`
      + `<button class="file-action-btn" onclick="openInEditor('${escAttr(f)}')" title="Open in Editor">✏️</button>`
      + `<button class="file-action-btn" onclick="revealInExplorer('${escAttr(f)}')" title="Open in Explorer">📂</button>`
      + `</span>`
    ).join('\n       ');
    parts.push(`files: ${links}`);
  }
  if (e.duration_ms) parts.push(`duration: ${e.duration_ms}ms`);
  return parts.join('\n');
}

function buildSubagentDetail(params) {
  if (!params) return '';
  let html = '';
  if (params.agentName) html += `\nAgent: ${esc(params.agentName)}`;
  if (params.model) html += `\nModel: ${esc(params.model)}`;
  if (params.prompt) {
    const promptPreview = params.prompt.substring(0, 300);
    html += `\n\nPrompt:\n${esc(promptPreview)}${params.prompt.length > 300 ? '...' : ''}`;
  }
  return html;
}

document.getElementById('timelineSearch')?.addEventListener('input', () => renderTimeline());

// Close file viewer on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('fileViewerOverlay').classList.contains('open')) {
    closeFileViewer();
  }
});

// ── SECURITY Page ──
async function loadSecurity() {
  const alerts = await api('/api/alerts?limit=200');
  state.alerts = alerts || [];

  if (!alerts || alerts.length === 0) {
    document.getElementById('securityContent').innerHTML = '<div class="empty-state"><div class="icon">🛡️</div><div class="msg">No alerts.<br>Everything looks clean!</div></div>';
    return;
  }

  const danger = alerts.filter(a => a.severity === 'danger').length;
  const warn = alerts.filter(a => a.severity === 'warn').length;
  const unreviewed = alerts.filter(a => !a.acknowledged).length;

  let filtered = alerts;
  if (state.securityFilter === 'danger') filtered = alerts.filter(a => a.severity === 'danger');
  else if (state.securityFilter === 'warn') filtered = alerts.filter(a => a.severity === 'warn');
  else if (state.securityFilter === 'unreviewed') filtered = alerts.filter(a => !a.acknowledged);

  document.getElementById('securityContent').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card" ${danger > 0 ? 'style="border-color:rgba(248,81,73,.3);"' : ''}>
        <div class="stat-label">Danger</div>
        <div class="stat-number text-red">${danger}</div>
      </div>
      <div class="stat-card" ${warn > 0 ? 'style="border-color:rgba(210,153,34,.3);"' : ''}>
        <div class="stat-label">Warnings</div>
        <div class="stat-number text-yellow">${warn}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Unreviewed</div>
        <div class="stat-number text-orange">${unreviewed}</div>
      </div>
    </div>

    <div class="flex-between mb-12">
      <div class="severity-filter">
        <span class="sev-pill ${state.securityFilter === 'all' ? 'active' : ''}" onclick="state.securityFilter='all';loadSecurity()">All (${alerts.length})</span>
        <span class="sev-pill danger ${state.securityFilter === 'danger' ? 'active' : ''}" onclick="state.securityFilter='danger';loadSecurity()">🔴 Danger (${danger})</span>
        <span class="sev-pill warn ${state.securityFilter === 'warn' ? 'active' : ''}" onclick="state.securityFilter='warn';loadSecurity()">🟡 Warn (${warn})</span>
        <span class="sev-pill ${state.securityFilter === 'unreviewed' ? 'active' : ''}" onclick="state.securityFilter='unreviewed';loadSecurity()">Unreviewed (${unreviewed})</span>
      </div>
      ${unreviewed > 0 ? `<button class="bulk-ack-btn" onclick="bulkAcknowledge()">✓ Ack All (${unreviewed})</button>` : ''}
    </div>

    <div class="section-title">Alerts (${filtered.length})</div>
    ${filtered.map(a => `
      <div class="alert-item clickable sev-${a.severity}" onclick="drillAlertToEvent(${a.event_id || 0}, '${esc(a.session_id || '')}')">
        <div class="flex-between">
          <div class="alert-time">${fmtTime(a.timestamp)}${a.session_id ? ` <span class="tl-session-link">📋 ${esc(a.session_id.substring(0,8))}</span>` : ''}</div>
          <span class="badge badge-${a.severity}">${esc(a.severity)}</span>
        </div>
        <div class="alert-msg">${esc(a.message)}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
          ${!a.acknowledged ? `<button class="alert-ack" onclick="event.stopPropagation();ackAlert(${a.id}, this)">✓ Acknowledge</button>` : `<button class="alert-ack done">✓ Acknowledged</button>`}
          ${a.session_id ? `<span style="font-size:.68rem;color:var(--accent);cursor:pointer" onclick="event.stopPropagation();drillAlertToEvent(${a.event_id || 0}, '${esc(a.session_id)}')">→ Go to event</span>` : ''}
        </div>
      </div>
    `).join('')}
  `;
}

async function ackAlert(id, btn) {
  await api('/api/alerts/' + id + '/acknowledge');
  btn.textContent = '✓ Acknowledged';
  btn.classList.add('done');
}

async function bulkAcknowledge() {
  await fetch('/api/alerts/acknowledge-all', { method: 'POST' });
  loadSecurity();
}

// ── MEMORY Page ──
async function loadMemory() {
  const ops = await api('/api/memory?limit=100');
  state.memory = ops || [];

  if (!ops || ops.length === 0) {
    document.getElementById('memoryContent').innerHTML = '<div class="empty-state"><div class="icon">🧠</div><div class="msg">No memory operations recorded yet.</div></div>';
    return;
  }

  document.getElementById('memoryContent').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total Ops</div>
        <div class="stat-number">${ops.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Flagged</div>
        <div class="stat-number text-red">${ops.filter(o => o.risk_level === 'danger' || o.risk_level === 'warn').length}</div>
      </div>
    </div>
    <div class="section-title">Recent Memory Operations</div>
    ${ops.map(o => {
      const opColor = o.operation === 'delete' ? 'var(--red)' : o.operation === 'write' ? 'var(--text-dim)' : 'var(--accent)';
      const isFlagged = o.risk_level === 'danger' || o.risk_level === 'warn';
      const isViewable = o.operation !== 'delete';
      return `
        <div class="mem-item" ${isFlagged ? 'style="border-color:rgba(248,81,73,.3);"' : ''}>
          <div class="mem-header">
            <div>
              ${isFlagged ? '<span class="badge badge-danger" style="margin-right:4px;">⚠ flagged</span>' : ''}
              <span style="font-size:.8rem;color:${opColor};">${esc(o.operation)} · ${fmtTime(o.timestamp)}</span>
            </div>
            <span class="mem-scope scope-${o.memory_scope}">${esc(o.memory_scope)}</span>
          </div>
          <div class="mem-path">
            <span class="detail-file-link" onclick="viewMemoryFile('${escAttr(o.memory_path)}')">${esc(o.memory_path)}</span>
            ${isViewable ? `<button class="mem-view-btn" onclick="viewMemoryFile('${escAttr(o.memory_path)}')">👁 View File</button>` : ''}
            <button class="mem-view-btn" onclick="revealInExplorer('${escAttr(o.memory_path)}')" style="color:var(--green);border-color:rgba(63,185,80,.15);background:rgba(63,185,80,.08);">📂 Reveal</button>
          </div>
          ${o.content_summary ? `<div class="mem-content">${esc(o.content_summary)}</div>` : ''}
          ${isFlagged ? `<div class="mem-flag">🚨 Flagged: risk level ${esc(o.risk_level)}</div>` : ''}
        </div>
      `;
    }).join('')}
  `;
}

// ── PROJECTS Page ──
async function loadProjects() {
  const projects = await api('/api/projects');
  state.projects = projects || [];

  if (!projects || projects.length === 0) {
    document.getElementById('projectsContent').innerHTML = '<div class="empty-state"><div class="icon">📁</div><div class="msg">No projects tracked yet.</div></div>';
    return;
  }

  document.getElementById('projectsContent').innerHTML = `
    <div class="section-title">Projects by Activity</div>
    ${projects.map(p => {
      const total = (+p.total_events) || 1;
      const dPct = Math.round((+p.danger_count) / total * 100);
      const wPct = Math.round((+p.warn_count) / total * 100);
      const safePct = 100 - dPct - wPct;
      const alertCount = (+p.danger_count) + (+p.warn_count);
      const badgeClass = p.danger_count > 0 ? 'badge-danger' : p.warn_count > 0 ? 'badge-warn' : 'badge-info';
      return `
        <div class="project-card clickable" onclick="drillProjectSessions('${escAttr(p.project_name || 'Unknown')}')">
          <div class="flex-between">
            <div class="project-name">${esc(p.project_name || 'Unknown')}</div>
            <span class="badge ${badgeClass}">${alertCount > 0 ? alertCount + ' alerts' : 'clean'}</span>
          </div>
          <div class="project-meta">${p.session_count} sessions · ${p.total_events} events · Last: ${fmtDate(p.last_active)}</div>
          <div class="project-bar-row">
            <div style="font-size:.82rem;color:var(--text-dim);width:52px;">Risk</div>
            <div class="project-bar-track">
              <div class="project-bar-seg" style="width:${safePct}%;background:var(--green);"></div>
              <div class="project-bar-seg" style="width:${wPct}%;background:var(--yellow);"></div>
              <div class="project-bar-seg" style="width:${dPct}%;background:var(--red);"></div>
            </div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

// ── Live polling (every 5s when on any page) ──
setInterval(async () => {
  if (state.currentPage === 'home') loadHome();
}, 15000);

// ── Initial load ──
loadHome();
